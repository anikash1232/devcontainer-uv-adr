[project]
name = "tk02-adr-for-uv-anikash1232"
version = "0.1.0"
description = "Minimal pyproject for uv dependency management (no deps yet)."
dependencies = [
    "requests>=2.32.5",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.10.0",
]

# `uv` will read this file to manage dependencies. We intentionally leave
# dependencies empty here; the project will rely on `uv` to populate
# `uv.lock` when developers add dependencies and run `uv sync`.

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.format]
quote-style = "double"

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # Pyflakes
    "I",     # isort
    "C4",    # flake8-comprehensions
    "UP",    # pyupgrade
]
ignore = ["E501"]  # Line too long (handled by formatter)
